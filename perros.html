<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perros Disponibles - Paw Conex</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/perros.css">
</head>

<body class="dogs-page">
    <div class="bg-organic">
        <div class="organic-shape shape-1"></div>
        <div class="organic-shape shape-2"></div>
        <div class="organic-shape shape-3"></div>
    </div>

    <!--NAV BAR-->
    <div class="navcontainer">
        <nav class="navbar">
            <a href="index.html" class="logo-group">
                <div class="logo-mark">
                    <img src="./images/dog-icon-white.svg" alt="Logo" class="logo-icon">
                </div>
                <span class="logo-text">Paw Conex</span>
            </a>
            <div class="nav-links">
                <a href="index.html">Inicio</a>
                <a href="perros.html" class="active">Perros disponibles</a>
                <a href="#contacto">Contacto</a>
                <button class="nav-button-login">Login</button>
                <button class="nav-button-sign-up">Sign Up</button>
            </div>
        </nav>
    </div>

        <!-- BARRA STICKY CON CONTROLES -->
        <div class="sticky-controls">
            <div class="controls-wrapper">
                <!-- Botón toggle filtros -->
                <button class="filter-toggle-btn" id="filterToggleBtn">
                    <div class="filter-mark">
                        <img src="./images/filter-icon-black.svg" alt="Filter Icon" class="filter-icon">
                    </div>
                    <span>Filtros</span>
                </button>

                <!-- Buscador -->
                <div class="sticky-search">
                    <img src="./images/search-icon.svg" alt="Buscar" class="search-icon">
                    <input type="search" id="searchInput" placeholder="Buscar por nombre..." />
                </div>

                <!-- Selector de raza para generar -->
                <div class="breed-selector">
                    <select id="breed-list"></select>
                </div>

                <!-- Botones de generar -->
                <div class="generate-buttons">
                    <button class="btn-generate btn-generate-single" id="add-1-dog">
                        <span>Generar 1</span>
                    </button>
                    <button class="btn-generate btn-generate-multiple" id="add-5-dogs">
                        <span>Generar 5</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- LAYOUT PRINCIPAL -->
        <div class="layout-container">
            <!-- SIDEBAR DE FILTROS -->
            <aside class="sidebar hidden" id="sidebar">
                <!-- Selector de raza para filtrar -->
                <div class="sidebar-section">
                    <label class="filter-sublabel">Filtrar por Raza</label>
                    <div class="filter-breed-select">
                        <select id="filter-breed-list"></select>
                    </div>
                </div>

                <div class="sidebar-divider"></div>

                <!-- Género -->
            <div class="sidebar-section">
                    <label class="filter-sublabel">Género</label>
                    <div class="gender-buttons">
                        <button class="gender-btn active" id="genderMaleBtn" data-gender="male">
                            ♂️ Macho
                        </button>
                        <button class="gender-btn active" id="genderFemaleBtn" data-gender="female">
                            ♀️ Hembra
                        </button>
                    </div>
            </div>

                <div class="sidebar-divider"></div>

                <!-- Edad -->
                <div class="sidebar-section">
                    <label class="filter-sublabel">Edad</label>
                    <div class="age-checkboxes">
                        <label class="age-checkbox-label">
                            <input type="checkbox" id="agePuppy" value="0-1" checked>
                            Cachorro (0-1 año)
                        </label>
                        <label class="age-checkbox-label">
                            <input type="checkbox" id="ageYoung" value="1-3" checked>
                            Joven (1-3 años)
                        </label>
                        <label class="age-checkbox-label">
                            <input type="checkbox" id="ageAdult" value="3-15" checked>
                            Adulto (3+ años)
                        </label>
                    </div>
                </div>

                <div class="sidebar-divider"></div>

                <!-- Solo favoritos -->
                <div class="sidebar-section">
                    <div class="favorites-toggle">
                        <div class="favorites-label">
                            <span>❤️</span>
                            <span>Solo Favoritos</span>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="favSwitch">
                            <span class="slider round"></span>
                        </label>
                    </div>
                </div>

                <div class="sidebar-divider"></div>

                <!-- Limpiar filtros -->
                <button class="clear-filters-btn" id="clearFiltersBtn">
                    <!--<span class="clear-icon">🗑️</span> -->
                    <span>Limpiar Filtros</span>
                </button>
            </aside>

            <!-- CONTENIDO PRINCIPAL -->
            <div class="main-content">
                <!-- Mensaje sin resultados -->
                <div class="no-results" id="noResults" style="display: none;">
                    <h3>No se encontraron perros</h3>
                    <p>Intenta ajustar tus filtros o añade más perros a la lista</p>
                    <div class="dog-search-error-image">
                        <img src="./images/sad-dog-2.png" alt="Perro meme triste">
                    </div>
                </div>

                <!-- Grid de perros -->
                <div id="dog-list" class="dog-grid"></div>
            </div>
    </div>

    <!-- MODAL DE AUTENTICACIÓN -->
    <div id="authModal" class="modal-overlay hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div id="loginFormContainer">
                <h2>Bienvenido de nuevo</h2>
                <form id="loginForm">
                    <input type="email" id="loginEmail" placeholder="Tu correo electrónico" required>
                    <input type="password" id="loginPassword" placeholder="Tu contraseña" required>
                    <button type="submit" class="btn-primary full-width">Iniciar Sesión</button>
                </form>
                <p class="switch-text">¿No tienes cuenta? <span id="showSignUp">Regístrate aquí</span></p>
            </div>
            <div id="signupFormContainer" class="hidden">
                <h2>Crea tu cuenta</h2>
                <form id="signupForm">
                    <input type="email" id="signupEmail" placeholder="Tu correo electrónico" required>
                    <input type="password" id="signupPassword" placeholder="Crea una contraseña" required>
                    <button type="submit" class="btn-primary full-width">Registrarse</button>
                </form>
                <p class="switch-text">¿Ya tienes cuenta? <span id="showLogin">Inicia sesión</span></p>
            </div>
        </div>
    </main>

    <!-- SCRIPTS -->
    <script src="./js/api.js"></script>
    <script src="./js/perros.js"></script>
    <script type="module" src="./js/auth.js"></script>
</body>

</html>
